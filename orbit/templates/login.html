{% extends "base.html" %}
{% block title %}Sign in · Orbit{% endblock %}
{% block page_title %}Sign in{% endblock %}
{% block body %}
<div class="o-narrow">
  <div class="o-panel"><div class="o-panel__body">
    <h1 class="o-h1 mb-3">Sign in</h1>
    {% if error %}<div class="o-alert o-alert--danger" role="alert"><i class="bi bi-exclamation-circle" aria-hidden="true"></i><div>{{ error }}</div></div>{% endif %}
    <form method="post" action="/login">
      <div class="o-field"><label class="o-label" for="email">Email</label><input class="o-input o-input--lg" id="email" type="email" name="email" required autocomplete="email" {% if error %}aria-invalid="true"{% endif %}></div>
      <div class="o-field"><label class="o-label" for="password">Password</label><input class="o-input o-input--lg" id="password" type="password" name="password" required autocomplete="current-password" {% if error %}aria-invalid="true"{% endif %}></div>
      <button class="o-btn o-btn--primary o-btn--lg o-btn--block" type="submit" data-loading="Signing in…">Sign in</button>
    </form>
    <p class="o-muted text-center mt-3 mb-0">New here? <a href="/signup">Get started</a></p>
  </div></div>
</div>
{% endblock %}
